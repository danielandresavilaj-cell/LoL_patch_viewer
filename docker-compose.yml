services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lol-viewer-api
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: "0.0.0.0"
    expose:
      - "3001"
    networks:
      - lol-net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lol-viewer-web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - lol-net
    restart: unless-stopped

networks:
  lol-net:
    name: lol-viewer-net
    driver: bridge
